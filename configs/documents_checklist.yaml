# Checklist de documentos por tipo de sinistro (ADR-0009) e regras de validação (ADR-0007).
COLISAO:
  - doc_type: CNH
    label: "CNH do condutor"
    required: true
    min_count: 1
    mime_types: [application/pdf, image/jpeg, image/png]
    max_size_bytes: 10485760
    min_size_bytes: 1024
    required_metadata: [cpf]
    consistency: {cpf: customer_cpf}
  - doc_type: CRLV
    label: "CRLV do veículo"
    required: true
    min_count: 1
    mime_types: [application/pdf, image/jpeg, image/png]
    max_size_bytes: 10485760
    min_size_bytes: 1024
    required_metadata: [plate]
    consistency: {plate: vehicle_plate}
  - doc_type: FOTO_DANO
    label: "Fotos dos danos"
    required: true
    min_count: 3
    mime_types: [image/jpeg, image/png]
    max_size_bytes: 15728640
    min_size_bytes: 1024
    required_metadata: [captured_at]
    consistency: {captured_at: not_before_event_date}
  - doc_type: BOLETIM_OCORRENCIA
    label: "Boletim de ocorrência"
    required: conditional
    required_if_any: [has_third_parties, has_injuries]
    min_count: 1
    mime_types: [application/pdf, image/jpeg, image/png]
    max_size_bytes: 10485760
    min_size_bytes: 1024
    required_metadata: []
