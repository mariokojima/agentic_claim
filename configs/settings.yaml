# Configuração geral da PoC. Valores podem ser sobrescritos por env (prefixo CLAIMS_, aninhamento com __).
data_dir: data
graph:
  max_hops_per_turn: 5
orchestrator:
  intents_enabled: true        # desvios do roteiro por regras (configs/orchestrator.yaml)
  intent_llm_enabled: false    # true: o LLM classifica a intenção quando as regras não resolvem
triage:
  max_attempts_per_field: 3
  inactivity_timeout_minutes: 60   # sem resposta por mais que isso, a Triagem recomeça
  llm_fallback: true               # LLM quando as regras não entendem o relato
# LLM via gateway no formato OpenAI (configs/models.yaml). Sem chave no .env → só regras.
llm:
  enabled: true
  rewrite_messages: false          # true: o LLM redige as mensagens (sempre passando pelo guardrail de saída)
documents:
  complement_timeout_hours: 72
pause:
  handoff_message: "Seu atendimento foi transferido para um de nossos especialistas humanos. Em breve alguém dará continuidade por aqui."
metrics:
  success_terminal_states: [CONCLUIDO, ORIENTADO]
  count_open_flows: false
  active_window_minutes: 60
# Modo demonstração: atraso por caixa do grafo e por tool (ADR-0012). 0 = desligado.
# `make run` liga via env (CLAIMS_DEMO__NODE_DELAY_MS / CLAIMS_DEMO__TOOL_DELAY_MS).
demo:
  node_delay_ms: 0
  subagent_delay_ms: 0
  tool_delay_ms: 0
tools:
  default_timeout_s: 5.0
  max_retries: 2
  backoff_base_s: 0.2
  impl:
    get_customer_data: mock
    send_whatsapp: mock
    open_claim: mock
    store_files: mock
    validate_document: mock
