# LLM no formato OpenAI (chat.completions) — ADR-0015.
# Qualquer provedor com endpoint compatível com a API da OpenAI funciona trocando `provider`.
# Chaves só no .env (variável indicada em api_key_env). `provider: none` desliga o LLM (só regras).
provider: gemini

providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  anthropic:
    base_url: https://api.anthropic.com/v1/
    api_key_env: ANTHROPIC_API_KEY

default:
  model: gemini-flash-latest
  fallback_models: [gemini-flash-lite-latest]  # usados em erros transitórios (ex.: 503 de alta demanda)
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 30
  max_retries: 0          # tentativas extras no mesmo modelo; 0 = vai direto ao fallback
  backoff_base_s: 0.5

# Ajustes por papel (herdam de default)
roles:
  extraction: {}          # extração estruturada (classificação, envolvidos)
  writer:                 # redação das mensagens ao cliente
    temperature: 0.4
  guardrail_classifier: {}
  intent: {}

# Preços para a estimativa de custo da avaliação (USD por 1 milhão de tokens).
# Valores de referência — confira a tabela vigente do provedor antes de citar custos.
pricing_usd_per_1m:
  gemini-flash-latest: {input: 0.30, output: 2.50}
  gemini-flash-lite-latest: {input: 0.10, output: 0.40}
  default: {input: 0.30, output: 2.50}
