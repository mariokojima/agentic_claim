# Regras da Triagem (ADR-0008, ADR-0014) — proposta para revisão do autor.
# Fluxo: identificar o segurado (CPF) → entender o ocorrido (classificação) → decidir (elegibilidade).

# Classificação do ocorrido por palavras-chave (regex, ignora maiúsculas). A primeira categoria da
# lista `priority` que casar vence (ex.: "bati e quebrou o para-brisa" → COLISAO, não VIDROS).
# A extração por LLM (Fase 3) mantém as mesmas categorias. Os tipos que abrem aviso estão em
# configs/claim_types.yaml; ASSISTENCIA e NAO_SINISTRO são apenas orientados.
event_classification:
  priority: [ROUBO_FURTO, INCENDIO, FENOMENO_NATURAL, COLISAO, VIDROS, ASSISTENCIA, NAO_SINISTRO]
  labels:
    COLISAO: "colisão (acidente de trânsito)"
    ROUBO_FURTO: "roubo ou furto"
    INCENDIO: "incêndio"
    FENOMENO_NATURAL: "evento da natureza (alagamento, granizo, queda de árvore)"
    VIDROS: "dano em vidros, faróis ou retrovisores"
    ASSISTENCIA: "pane ou necessidade de assistência"
    NAO_SINISTRO: "assunto que não é um sinistro"
  patterns:
    ROUBO_FURTO:
      - "(?i)\\b(roub\\w*|furt\\w*|assalt\\w*|levaram\\s+(o|meu)\\s+(carro|ve[ií]culo)|sumiu\\s+(o|meu)\\s+carro)\\b"
    INCENDIO:
      - "(?i)\\b(inc[eê]ndio|pegou\\s+fogo|incendi\\w*|queimou|em\\s+chamas)\\b"
    COLISAO:
      - "(?i)\\b(bat(?:i|eu|eram|emos|endo|er|ida|idas|ido|e)|colid\\w*|colis[aã]o|abalro\\w*|choc\\w*|choque|engavet\\w*|capot\\w*|tomb\\w*|acidente|batida)\\b"
      - "(?i)\\b(fui|foi|fomos)\\s+(atingid\\w*|fechad\\w*|acertad\\w*)\\b"
      - "(?i)\\b(amass\\w*|ralad\\w*|arranh\\w*)\\b.{0,40}\\b(carro|ve[ií]culo|porta|para-?choque|lateral|traseira|frente)\\b"
      - "(?i)\\b(carro|ve[ií]culo|porta|para-?choque|lateral|traseira|frente)\\b.{0,40}\\b(amass\\w*|ralad\\w*|arranh\\w*)\\b"
    FENOMENO_NATURAL:
      - "(?i)\\b(alag\\w*|enchente|inunda\\w*|granizo|[aá]rvore\\s+caiu|caiu\\s+(uma\\s+)?[aá]rvore|desabamento|vendaval)\\b"
    VIDROS:
      - "(?i)\\b(para-?brisa|vidro|retrovisor|farol|lanterna)\\b.{0,30}\\b(trinc\\w*|quebr\\w*|rach\\w*|estour\\w*)\\b"
      - "(?i)\\b(trinc\\w*|quebr\\w*|rach\\w*)\\b.{0,30}\\b(para-?brisa|vidro|retrovisor|farol|lanterna)\\b"
    ASSISTENCIA:
      - "(?i)\\b(pane|guincho|reboque|pneu\\s+(furado|estourado)|bateria|n[aã]o\\s+(liga|pega|d[aá]\\s+partida)|chave\\s+(trancada|perdida)|sem\\s+combust[ií]vel)\\b"
    NAO_SINISTRO:
      - "(?i)\\b(d[uú]vida|boleto|segunda\\s+via|2[ªa]\\s+via|pagamento|parcela|renova\\w*|cancel\\w*|cota[cç][aã]o|contratar|endere[cç]o|cadastro)\\b"
  # Urgência alta: há feridos (registrada e sinalizada; não muda o fluxo na v1)
  injuries_patterns:
    - "(?i)\\b(ferid\\w*|machuc\\w*|hospital|ambul[aâ]ncia|samu|v[ií]tima|sangr\\w*|desmai\\w*)\\b"

# Envolvidos (subagente "Envolvidos", só para colisão). Negativas são avaliadas antes das positivas.
# Terceiros ou feridos tornam o BO obrigatório na etapa de Documentos (documents_checklist.yaml).
parties:
  no_third_parties_patterns:
    - "(?i)\\b(sozinh[oa]|s[oó]\\s+eu|ningu[eé]m\\s+mais|nenhum\\s+outro|sem\\s+(outro|terceiro)s?|n[aã]o\\s+(havia|tinha|teve)\\s+(outro|mais\\s+ningu[eé]m))\\b"
    - "(?i)\\b(bati|colidi|encostei|raspei|ralei)\\s+(\\w+\\s+){0,3}(n[oa]|em|num[a]?|contra)\\s+(\\w+\\s+){0,2}(poste|muro|parede|port[aã]o|pilar|[aá]rvore|guia|meio-?fio|mureta|grade|cerca|coluna)\\b"
  third_parties_patterns:
    - "(?i)\\b(outr[oa]s?\\s+(carro|ve[ií]culo|motorista|condutor|moto|caminh[aã]o|[oô]nibus|pessoa)s?|terceir[oa]s?)\\b"
    - "(?i)\\b(uma?\\s+)?(moto(queiro|ciclista)?|[oô]nibus|caminh[aã]o|van|pedestre|ciclista|bicicleta|taxi|t[aá]xi|uber)\\b"
    - "(?i)\\b(um\\s+(cara|carro|motorista|sujeito|rapaz|senhor|senhora|mulher|homem)|o\\s+outro|me\\s+fechou|bateram|bateu\\s+(em\\s+mim|n[oa]\\s+meu|n[oa]\\s+minha)|fui\\s+(atingid|fechad|acertad)\\w*)\\b"
    - "(?i)\\b(bati|colidi)\\s+(\\w+\\s+){0,3}(em|n[oa]|com)\\s+(\\w+\\s+){0,2}(carro|ve[ií]culo|moto|traseira|caminh[aã]o)\\b"
  no_injuries_patterns:
    - "(?i)\\b(ningu[eé]m\\s+(se\\s+)?(feriu|machucou|ferid[oa]|machucad[oa])|sem\\s+(feridos|v[ií]timas)|tod[oa]s\\s+bem|n[aã]o\\s+(houve|teve|h[aá])\\s+(feridos|v[ií]timas)|ningu[eé]m\\s+saiu\\s+ferido)\\b"
  injuries_patterns:
    - "(?i)\\b(ferid\\w*|machuc\\w*|hospital|ambul[aâ]ncia|samu|v[ií]tima|sangr\\w*|desmai\\w*)\\b"

eligibility:
  # tipos aceitos e cobertura exigida por tipo: configs/claim_types.yaml (ADR-0018)
  required_policy_status: ATIVA
  event_must_be_within_policy_term: true

rejection_messages:
  customer_not_found: "Não localizamos uma apólice com esses dados. Por favor, entre em contato com seu corretor."
  policy_not_active: "Sua apólice não está ativa no momento, por isso não é possível abrir o aviso por aqui. Seu corretor poderá orientar os próximos passos."
  outside_policy_term: "A data do evento está fora da vigência da apólice. Seu corretor poderá orientar os próximos passos."
  no_coverage: "Sua apólice não possui cobertura para {event}. Seu corretor poderá orientar sobre outras opções."
  event_type_out_of_scope: "Este canal atende avisos de sinistro do veículo. Para este assunto, entre em contato com a central."
  # Orientação para ocorridos que não abrem aviso de sinistro
  event_type_ASSISTENCIA: "Para pane, guincho, pneu ou bateria, acione a Assistência 24h pelo 0800 000 0002 (fictício). Esse atendimento não abre um aviso de sinistro."
  event_type_NAO_SINISTRO: "Este canal é dedicado a sinistros e consultas da apólice. Para pagamentos, boletos ou alteração de cadastro, fale com seu corretor ou acesse a área do cliente."

urgency:
  high_if_any: [has_injuries]
