# Mensagens determinísticas ao cliente (templates str.format). Redação por LLM entra nas fases 3+.
triage:
  ask_cpf: "Olá! Sou o assistente virtual de sinistros. Para começar, informe o CPF do titular da apólice."
  invalid_cpf: "Não consegui identificar um CPF válido. Pode digitar novamente, só os números?"
  ask_event: "Obrigado, {name}! Localizei seu cadastro. Agora me conte: o que aconteceu?"
  unclear_event: "Não consegui entender o ocorrido. Pode me contar o que aconteceu com o veículo? (ex.: bati em outro carro, fui atingido no cruzamento)"
  ask_parties_both: "Entendi. Para seguir, me diga: havia outro veículo ou pessoa envolvida? E alguém se feriu?"
  ask_parties_third_parties: "Havia outro veículo ou pessoa envolvida no ocorrido?"
  ask_parties_injuries: "Alguém se feriu?"
  unclear_parties: "Não consegui entender. Por favor, responda: havia outro veículo ou pessoa envolvida? Alguém se feriu? (ex.: \"sim, outro carro; ninguém se feriu\")"
  session_expired: "Como ficamos um tempo sem conversar, vou reiniciar o atendimento para garantir que os dados estejam corretos."
  urgent: "⚠️ Se houver pessoas feridas, ligue imediatamente para o SAMU (192)."
  identified: "Entendi: trata-se de {event}. Sua apólice {policy} (veículo {plate}) cobre esse tipo de ocorrência, então vou registrar o aviso de sinistro."
notice:
  ask_description: "Para registrar o aviso, descreva o ocorrido: quando, onde e o que aconteceu."
  understood: "Obrigado! Já anotei — {summary}."
  missing: "Para registrar o aviso, ainda preciso saber:\n{items}"
  missing_when: "• quando aconteceu (data, ex.: hoje, ontem, 12/10 — e a hora, se souber)"
  missing_where: "• onde aconteceu (rua/avenida e número, rodovia ou ponto de referência)"
  missing_what: "• o que aconteceu (ex.: bati na traseira de outro carro, fui atingido no cruzamento)"
  missing_damages: "• quais partes do veículo foram danificadas (ex.: para-choque traseiro, porta do motorista)"
  future_date: "A data informada ({date}) está no futuro. Pode confirmar quando o acidente aconteceu?"
  registered: "Aviso registrado com sucesso! Seu protocolo é {protocol}.\nResumo: {when} — {location}.{damages}"
  coverage: "Avaliação preliminar: o evento está entre as coberturas da sua apólice{third_party}. A confirmação depende da análise da equipe."
  third_party_included: "; a apólice inclui cobertura para danos a terceiros"
  third_party_not_included: "; a apólice não inclui cobertura para danos a terceiros"
documents:
  request: "Para concluir a abertura, envie pelo clipe de anexos:\n{items}"
  reminder: "Estou aguardando os documentos. Ainda faltam:\n{items}"
  reminder_timer: "Olá! Para concluir a abertura do sinistro {protocol}, ainda precisamos de:\n{items}\nÉ só enviar pelo clipe de anexos."
  validated: "Já validei:\n{items}"
  pending: "Ainda faltam:\n{items}"
  issues: "Alguns arquivos precisam ser reenviados:\n{issues}"
  done: "Tudo certo, a abertura do sinistro foi concluída! ✅\nProtocolo: {protocol}\nResumo: {summary}\n\nDocumentos recebidos:\n{received}\n\nPróximos passos:\n1. Nossa equipe vai analisar o aviso e os documentos.\n2. Se necessário, entraremos em contato para agendar a vistoria do veículo.\n3. As atualizações chegarão por aqui; tenha o protocolo {protocol} em mãos."
  missing_type: "não foi possível identificar o tipo do documento"
transition:
  refused: "Desculpe, não posso atender a esse pedido por este canal. Vamos continuar de onde paramos:"
  resume_default: "Como posso ajudar com o seu sinistro? Para começar, me conte o que aconteceu."
  blocked: "Não posso dar continuidade a esta solicitação por este canal. O atendimento foi encerrado."
  escalated: "Vou transferir seu atendimento para um de nossos especialistas humanos."
  documents_timeout: "Como não recebemos os documentos dentro do prazo, seu aviso foi encaminhado a um especialista, que entrará em contato para dar continuidade."
  cancelled: "Tudo bem, encerrei o atendimento a seu pedido. Se precisar, é só enviar uma nova mensagem."
  failed: "Tivemos um problema para concluir esta etapa. Um especialista humano dará continuidade ao seu atendimento."
policy_info:
  ask_cpf: "Para consultar os dados da sua apólice, informe o CPF do titular."
  invalid_cpf: "Não consegui identificar um CPF válido. Pode digitar só os números?"
  not_found: "Não localizei apólices para esse CPF. Seu corretor poderá ajudar."
  unavailable: "Não consegui consultar sua apólice agora. Tente novamente em instantes."
  unknown: "Não encontrei essa informação por aqui. Seu corretor ou a central poderão ajudar."
  header_one: "Aqui estão as informações da sua apólice:"
  header_many: "Aqui estão as informações das suas apólices:"
  footer: "Limites, condições e franquias seguem o contrato da apólice."
  term: "vigência de {start} a {end}"
  expires_on: "vence em {end} (daqui a {days} dias)"
  expires_today: "vence hoje"
  expired_on: "venceu em {end}"
  renewal_future: "a renovação pode ser feita de {start} até {end}, com seu corretor ou pela central"
  renewal_open: "já está no período de renovação, até {end}; fale com seu corretor ou com a central"
  renewal_expired: "venceu em {end}; para voltar a ter cobertura, fale com seu corretor"
  renewal_cancelled: "está cancelada; para contratar um novo seguro, fale com seu corretor"
  has_coverage: "sim, inclui a cobertura de {coverage}"
  lacks_coverage: "não inclui a cobertura de {coverage}"
  anything_else: "Posso ajudar com mais alguma coisa? Se precisar abrir um sinistro, é só me contar o que aconteceu."
orchestrator:
  status: "Seu atendimento está na etapa {stage}.{protocol_info}"
  duvida: "Posso ajudar com a abertura do sinistro por aqui. Dúvidas sobre franquia, prazos, valores e cobertura serão esclarecidas pela equipe após a análise do aviso."
  fora_de_escopo: "Este canal é dedicado à abertura de sinistros de automóvel, então não consigo ajudar com esse assunto por aqui."
  resume: "Vamos continuar:"
  correction: "Anotei sua correção; ela será considerada na análise."
system:
  closed: "Este atendimento já foi encerrado ({stage}).{protocol_info}"
  output_blocked: "Desculpe, não consegui gerar uma resposta adequada. Um atendente dará continuidade."
