# Mensagens determinísticas ao cliente (templates str.format).
# Tom: humano, acolhedor e empático — o segurado pode estar abalado (ver prompts/common/writer.md).
triage:
  ask_cpf: "Olá! Sou o assistente virtual de sinistros e estou aqui para te ajudar. 💙\nPara começar, pode me informar o CPF do titular da apólice?"
  invalid_cpf: "Não consegui reconhecer o CPF. Sem problema — pode digitar de novo, só os números?"
  ask_event: "Obrigado, {name}! Já localizei seu cadastro.\nAgora, com calma, me conte: o que aconteceu?"
  unclear_event: "Desculpe, ainda não consegui entender bem o que aconteceu. Pode me contar com suas palavras o que houve com o veículo? (ex.: bati em outro carro, fui atingido no cruzamento, levaram meu carro)"
  ask_parties_both: "Só preciso confirmar duas coisas: havia outro veículo ou pessoa envolvida? E alguém se feriu?"
  ask_parties_third_parties: "Havia outro veículo ou pessoa envolvida no ocorrido?"
  ask_parties_injuries: "Alguém se feriu?"
  unclear_parties: "Desculpe, não consegui entender. Pode me responder, por favor: havia outro veículo ou pessoa envolvida? Alguém se feriu? (ex.: \"sim, outro carro; ninguém se feriu\")"
  session_expired: "Que bom ter você de volta! Como ficamos um tempo sem conversar, vou recomeçar o atendimento para garantir que seus dados estejam corretos."
  urgent: "⚠️ Se alguém estiver ferido, a prioridade é a saúde: ligue agora para o SAMU (192). Cuidaremos do restante com você."
  # Acolhimento conforme o tipo de sinistro, antes da confirmação (opcional por tipo)
  empathy:
    COLISAO: "Sinto muito pelo acidente. O mais importante é que você esteja bem — vou te ajudar em cada passo."
    ROUBO_FURTO: "Sinto muito, passar por um roubo ou furto é muito desgastante. Vou te ajudar a resolver isso da forma mais simples possível."
    INCENDIO: "Sinto muito pelo ocorrido. Espero que todos estejam em segurança — vou te ajudar com o que for preciso."
    FENOMENO_NATURAL: "Sinto muito pelo transtorno. Situações assim pegam a gente de surpresa — vamos cuidar disso juntos."
    VIDROS: "Que chato isso ter acontecido! Vamos resolver rapidinho."
  identified: "Entendi: trata-se de {event}. Sua apólice {policy} (veículo {plate}) cobre esse tipo de ocorrência, então vou registrar o aviso de sinistro para você."
notice:
  ask_description: "Para registrar o aviso, me conte, no seu tempo: quando, onde e o que aconteceu."
  understood: "Obrigado por me contar. Já anotei — {summary}."
  missing: "Para registrar o aviso, só preciso de mais alguns detalhes:\n{items}"
  missing_when: "• quando aconteceu (data, ex.: hoje, ontem, 12/10 — e a hora, se souber)"
  missing_where: "• onde aconteceu (rua/avenida e número, rodovia ou ponto de referência)"
  missing_what: "• o que aconteceu (ex.: bati na traseira de outro carro, fui atingido no cruzamento)"
  missing_damages: "• quais partes do veículo foram danificadas (ex.: para-choque traseiro, porta do motorista)"
  future_date: "A data informada ({date}) ficou no futuro. Pode confirmar, por favor, quando o ocorrido aconteceu?"
  registered: "Pronto, seu aviso foi registrado! O protocolo é {protocol}.\nResumo: {when} — {location}.{damages}"
  coverage: "Numa avaliação preliminar, o evento está entre as coberturas da sua apólice{third_party}. A confirmação final vem após a análise da nossa equipe."
  third_party_included: "; a apólice inclui cobertura para danos a terceiros"
  third_party_not_included: "; a apólice não inclui cobertura para danos a terceiros"
documents:
  request: "Estamos quase lá! Para concluir a abertura, envie pelo clipe de anexos:\n{items}\nSe não tiver tudo agora, não se preocupe: pode enviar aos poucos."
  reminder: "Sigo por aqui aguardando os documentos, sem pressa. Ainda faltam:\n{items}"
  reminder_timer: "Olá! Passando para lembrar, com carinho, que para concluir a abertura do sinistro {protocol} ainda precisamos de:\n{items}\nQuando puder, é só enviar pelo clipe de anexos."
  validated: "Recebi e validei:\n{items}"
  pending: "Ainda faltam:\n{items}"
  issues: "Alguns arquivos precisam ser reenviados — acontece, não se preocupe:\n{issues}"
  done: "Tudo certo! A abertura do seu sinistro foi concluída. ✅\nProtocolo: {protocol}\nResumo: {summary}\n\nDocumentos recebidos:\n{received}\n\nPróximos passos:\n1. Nossa equipe vai analisar o aviso e os documentos.\n2. Se necessário, entraremos em contato para agendar a vistoria do veículo.\n3. As atualizações chegarão por aqui; guarde o protocolo {protocol}.\n\nSei que este momento não é fácil. Obrigado pela confiança — estamos com você até o fim."
  missing_type: "não foi possível identificar o tipo do documento"
transition:
  refused: "Desculpe, não consigo ajudar com esse pedido por aqui. Vamos continuar de onde paramos:"
  resume_default: "Estou aqui para ajudar com o seu sinistro. Quando quiser, me conte o que aconteceu."
  blocked: "Não consigo dar continuidade a esta solicitação por este canal, por isso o atendimento foi encerrado."
  escalated: "Entendo. Vou transferir seu atendimento para um de nossos especialistas, que vai te ajudar pessoalmente."
  documents_timeout: "Como os documentos não chegaram dentro do prazo, encaminhei seu aviso a um especialista, que vai entrar em contato para te ajudar a concluir."
  cancelled: "Tudo bem, encerrei o atendimento como você pediu. Se precisar de qualquer coisa, é só mandar uma nova mensagem — estaremos aqui."
  failed: "Tivemos um problema do nosso lado para concluir esta etapa, e peço desculpas por isso. Um especialista vai dar continuidade ao seu atendimento."
policy_info:
  ask_cpf: "Claro, posso consultar para você! Pode me informar o CPF do titular da apólice?"
  invalid_cpf: "Não consegui reconhecer o CPF. Pode digitar de novo, só os números?"
  not_found: "Não encontrei apólices para esse CPF. Seu corretor poderá te ajudar com isso."
  unavailable: "Não consegui consultar sua apólice agora, desculpe. Pode tentar de novo em instantes?"
  unknown: "Essa informação eu não tenho por aqui, desculpe. Seu corretor ou a nossa central poderão te ajudar."
  header_one: "Aqui estão as informações da sua apólice:"
  header_many: "Aqui estão as informações das suas apólices:"
  footer: "Limites, condições e franquias seguem o contrato da apólice."
  term: "vigência de {start} a {end}"
  expires_on: "vence em {end} (daqui a {days} dias)"
  expires_today: "vence hoje"
  expired_on: "venceu em {end}"
  renewal_future: "a renovação pode ser feita de {start} até {end}, com seu corretor ou pela central"
  renewal_open: "já está no período de renovação, até {end}; fale com seu corretor ou com a central"
  renewal_expired: "venceu em {end}; para voltar a ter cobertura, fale com seu corretor"
  renewal_cancelled: "está cancelada; para contratar um novo seguro, fale com seu corretor"
  has_coverage: "sim, inclui a cobertura de {coverage}"
  lacks_coverage: "não inclui a cobertura de {coverage}"
  anything_else: "Posso ajudar em mais alguma coisa? Se precisar abrir um sinistro, é só me contar o que aconteceu."
orchestrator:
  status: "Seu atendimento está na etapa {stage}.{protocol_info}"
  duvida: "Posso te ajudar com a abertura do sinistro por aqui. Dúvidas sobre franquia, prazos, valores e cobertura serão esclarecidas pela equipe na análise do aviso."
  fora_de_escopo: "Esse assunto foge do que consigo atender por aqui — este canal é dedicado a sinistros e consultas da sua apólice."
  resume: "Vamos continuar:"
  correction: "Anotei sua correção, obrigado por avisar. Ela será considerada na análise."
system:
  closed: "Este atendimento já foi encerrado ({stage}).{protocol_info} Se precisar de algo novo, estamos à disposição."
  output_blocked: "Desculpe, não consegui formular uma resposta adequada. Um atendente vai continuar a conversa com você."
